name: Fetch News (Hourly)

on:
  schedule:
    # 4 saatte bir çalışır (00:00, 04:00, 08:00... UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Fetch News
        run: |
          curl -L -sS -X GET "https://d4ily.com/api/cron/fetch-news" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail

      - name: Process News
        run: |
          curl -L -sS -X GET "https://d4ily.com/api/cron/process-news" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail

