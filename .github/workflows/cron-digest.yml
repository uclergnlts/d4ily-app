name: Generate Daily Digest
on:
  schedule:
    # Her gÃ¼n 04:00 UTC'de Ã§alÄ±ÅŸÄ±r (TÃ¼rkiye saati 07:00)
    - cron: '0 4 * * *'
  workflow_dispatch: # Manuel tetikleme iÃ§in

jobs:
  digest:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Trigger Daily Digest Generation
        run: |
          response=$(curl -L -s -w "%{http_code}" -X GET "https://d4ily.com/api/cron/generate-digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          http_code=${response: -3}
          content=${response:0:${#response}-3}
          
          echo "HTTP Status: $http_code"
          echo "Response Content:"
          echo "$content"
          
          if [ "$http_code" -ne 200 ]; then
            exit 1
          fi

      - name: Trigger AI News Processing
        run: |
          curl -L -sS -X GET "https://d4ily.com/api/cron/process-news" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail

